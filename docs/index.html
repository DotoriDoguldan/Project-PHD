<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <!-- 모바일 브라우저: 확대/축소 차단, 노치 영역까지 사용 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0D0F1A">
  <title>Project-PHD</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0D0F1A;
      /* 모바일에서 길게 눌렀을 때 텍스트 선택/복사 팝업 방지 */
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      /* 주소창 숨김/스크롤 바운스 방지 */
      overscroll-behavior: none;
      position: fixed;
    }
    /* 실제 표시 크기는 컨테이너가 갖는다.
       Unity 로더가 캔버스의 인라인 style 을 덮어쓰기 때문에,
       캔버스에는 스타일시트 규칙(100%)만 걸어두고 크기는 부모로 제어한다. */
    #unity-container {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      line-height: 0;
    }
    #unity-canvas {
      width: 100%;
      height: 100%;
      display: block;
      background: #0D0F1A;
      /* 픽셀아트 확대 시 뭉개지지 않도록 최근접 이웃 보간 */
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      /* 더블탭 확대·스와이프 스크롤이 캔버스에서 발생하지 않게 한다 */
      touch-action: none;
      outline: none;
    }
    #unity-loading {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 60%;
      max-width: 320px;
      font-family: system-ui, -apple-system, sans-serif;
      color: #9AA3C7;
      text-align: center;
      font-size: 13px;
      letter-spacing: 0.08em;
    }
    #unity-progress-track {
      margin-top: 10px;
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 2px;
      overflow: hidden;
    }
    #unity-progress-fill {
      width: 0%;
      height: 100%;
      background: #7C8CFF;
      transition: width 0.15s ease-out;
    }
    #unity-error {
      display: none;
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 80%;
      font-family: system-ui, -apple-system, sans-serif;
      color: #FF8FA3;
      text-align: center;
      font-size: 14px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
  </div>

  <div id="unity-loading">
    LOADING
    <div id="unity-progress-track"><div id="unity-progress-fill"></div></div>
  </div>

  <div id="unity-error"></div>

  <script src="Build/docs.loader.js"></script>
  <script>
    (function () {
      var canvas = document.querySelector("#unity-canvas");
      var loading = document.querySelector("#unity-loading");
      var fill = document.querySelector("#unity-progress-fill");
      var errorBox = document.querySelector("#unity-error");

      // 캔버스 위 우클릭 메뉴 / 제스처 확대 차단
      canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });
      document.addEventListener("gesturestart", function (e) { e.preventDefault(); });

      // ---- 렌더 버퍼 크기 계산 ----
      // 픽셀 퍼펙트 카메라는 정수 배율만 쓰기 때문에, 캔버스를 화면 크기 그대로 두면
      // 데스크톱(세로 픽셀이 부족한 화면)에서 배율이 1 로 떨어져 게임이 작게 렌더된다.
      // 그래서 버퍼를 "기준 해상도 x 고정 배율"로 잡고, 최종 확대는 브라우저(CSS)에 맡긴다.
      // 이렇게 하면 어떤 기기에서도 보이는 영역(=구도)이 동일하다.
      var BASE_W = 270;   // GameLayout.RefWidth
      var BASE_H = 480;   // GameLayout.RefHeight

      var container = document.querySelector("#unity-container");

      function layoutCanvas() {
        var vw = window.innerWidth || document.documentElement.clientWidth;
        var vh = window.innerHeight || document.documentElement.clientHeight;
        // 숨겨진 탭/iframe 에서 로드되면 크기가 0 으로 들어온다. 이때 계산하면
        // 캔버스가 0 높이로 굳어버리므로 건너뛰고, 보이게 됐을 때 다시 계산한다.
        if (!vw || !vh) return;

        var dpr = Math.min(window.devicePixelRatio || 1, 2);

        // 화면이 감당할 수 있는 배율(2~4). 배율은 선명도만 바꾸고 구도는 바꾸지 않는다.
        var scale = Math.floor(Math.min(vw * dpr / BASE_W, vh * dpr / BASE_H));
        scale = Math.max(2, Math.min(4, scale));

        // 세로는 화면비에 따라 늘어난다(긴 폰일수록 위아래가 더 보인다)
        var bufW = BASE_W * scale;
        var bufH = Math.max(BASE_H * scale, Math.round(bufW * vh / vw));

        canvas.width = bufW;
        canvas.height = bufH;

        // 버퍼 비율을 유지한 채 화면에 맞춰 확대/축소(남는 부분은 배경색)
        var fit = Math.min(vw / bufW, vh / bufH);
        container.style.width = Math.round(bufW * fit) + "px";
        container.style.height = Math.round(bufH * fit) + "px";
      }

      layoutCanvas();
      window.addEventListener("resize", layoutCanvas);
      window.addEventListener("orientationchange", layoutCanvas);
      // 숨겨진 상태로 로드된 뒤 화면에 나타나는 경우를 위해
      document.addEventListener("visibilitychange", layoutCanvas);
      if (window.ResizeObserver) new ResizeObserver(layoutCanvas).observe(document.documentElement);

      var config = {
        dataUrl: "Build/docs.data.unityweb",
        frameworkUrl: "Build/docs.framework.js.unityweb",
        codeUrl: "Build/docs.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Project-PHD",
        productVersion: "1.0",
        // 렌더 버퍼는 layoutCanvas 가 직접 관리하므로 Unity 가 덮어쓰지 않게 한다.
        matchWebGLToCanvasSize: false,
        devicePixelRatio: 1
      };

      createUnityInstance(canvas, config, function (progress) {
        fill.style.width = (progress * 100) + "%";
      }).then(function () {
        loading.style.display = "none";
        // 로더가 캔버스 크기를 건드렸을 수 있으므로 마지막에 한 번 더 맞춘다.
        layoutCanvas();
        canvas.focus();
      }).catch(function (message) {
        loading.style.display = "none";
        errorBox.style.display = "block";
        errorBox.textContent = message;
      });
    })();
  </script>
</body>
</html>
