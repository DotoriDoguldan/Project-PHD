<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <!-- 모바일 브라우저: 확대/축소 차단, 노치 영역까지 사용 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0D0F1A">
  <title>{{{ PRODUCT_NAME }}}</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0D0F1A;
      /* 모바일에서 길게 눌렀을 때 텍스트 선택/복사 팝업 방지 */
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      /* 주소창 숨김/스크롤 바운스 방지 */
      overscroll-behavior: none;
      position: fixed;
    }
    /* 실제 표시 크기는 컨테이너가 갖는다.
       Unity 로더가 캔버스의 인라인 style 을 덮어쓰기 때문에,
       캔버스에는 스타일시트 규칙(100%)만 걸어두고 크기는 부모로 제어한다. */
    #unity-container {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      line-height: 0;
    }
    #unity-canvas {
      width: 100%;
      height: 100%;
      display: block;
      background: #0D0F1A;
      /* 픽셀아트 확대 시 뭉개지지 않도록 최근접 이웃 보간 */
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      /* 더블탭 확대·스와이프 스크롤이 캔버스에서 발생하지 않게 한다 */
      touch-action: none;
      outline: none;
    }
    #unity-loading {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 60%;
      max-width: 320px;
      font-family: system-ui, -apple-system, sans-serif;
      color: #9AA3C7;
      text-align: center;
      font-size: 13px;
      letter-spacing: 0.08em;
    }
    #unity-progress-track {
      margin-top: 10px;
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 2px;
      overflow: hidden;
    }
    #unity-progress-fill {
      width: 0%;
      height: 100%;
      background: #7C8CFF;
      transition: width 0.15s ease-out;
    }
    #unity-error {
      display: none;
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 80%;
      font-family: system-ui, -apple-system, sans-serif;
      color: #FF8FA3;
      text-align: center;
      font-size: 14px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
  </div>

  <div id="unity-loading">
    LOADING
    <div id="unity-progress-track"><div id="unity-progress-fill"></div></div>
  </div>

  <div id="unity-error"></div>

  <!-- ==================== 공유 버튼 히트 영역 ====================
       버튼 그림은 Unity UI(Btn_Kakao / Btn_Share)가 그린다. 여기 있는 것은 그 위에 정확히
       겹쳐 놓는 <b>투명한 클릭 영역</b>일 뿐이다 — 보이는 것은 하나도 없다.

       이렇게 나눈 이유: navigator.share 와 카카오 SDK 는 사용자 제스처 안에서 불려야 하는데,
       Unity 는 클릭을 DOM 이벤트 핸들러가 아니라 다음 프레임에서 처리한다. 그래서 클릭은 DOM 이
       받고(제스처 보존), 아트는 Unity 가 그린다(RETRY 와 같은 스프라이트·폰트).

       Unity(ResultScreen → WebShare.cs → PHDShare.jslib)가 위치와 표시를 지시한다.
       자리를 눈으로 확인하려면 브라우저 콘솔에서:
         PHDShare.show({ round: 8, score: 1240, best: 1500, newBest: false });
         PHDShare.place(0.2, 0.62, 0.6, 0.06);
         PHDShare.debug(true)          // 히트 영역을 빨간 테두리로 표시
  -->
  <div id="phd-share-layer" hidden>
    <button type="button" id="phd-kakao" class="phd-btn">카카오톡으로 알리기</button>
    <button type="button" id="phd-share" class="phd-btn">친구에게 알리기</button>
    <div id="phd-toast" role="status" aria-live="polite"></div>
  </div>

  <style>
    /* 캔버스 위에 얹히는 버튼 줄. 컨테이너는 클릭을 통과시키고 버튼만 받는다 —
       버튼 사이 빈 자리가 게임 입력을 가로채면 안 된다.

       칸 나눔은 Unity 쪽 ResultScreenBuildKit 의 상수를 그대로 옮긴 것이다
       (Area_Share 152×37 = 초록 바 116 + 간격 4 + 카카오 아이콘 32).
       한쪽만 고치면 초록 바를 눌렀는데 카카오가 뜬다. */
    #phd-share-layer {
      position: fixed;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 2.63%;            /* 4 / 152 */
      pointer-events: none;
    }
    #phd-share-layer[hidden] { display: none; }

    /* 카카오 아이콘이 왼쪽, 넓은 초록 바가 오른쪽 — 마크업 순서 그대로다. */
    #phd-kakao { flex: 0 0 21.05%; height: 86.5%; }   /* 32 / 152, 32 / 37 */
    #phd-share { flex: 1 1 auto; height: 100%; }

    /* 보이는 것은 전부 Unity 가 그린다. 이쪽은 클릭만 받는 투명한 판이다.
       글자는 남겨 둔다 — 화면에는 안 보여도 스크린 리더에는 읽힌다. */
    .phd-btn {
      min-width: 0;
      padding: 0;
      margin: 0;
      box-sizing: border-box;
      background: transparent;
      border: 0;
      color: transparent;
      font: inherit;
      cursor: pointer;
      pointer-events: auto;
      -webkit-tap-highlight-color: transparent;
      -webkit-appearance: none;
      appearance: none;
    }
    .phd-btn:focus-visible { outline: 2px solid #7C8CFF; outline-offset: 2px; }

    /* PHDShare.debug(true) 로 켜는 확인용 표시. 평소에는 꺼져 있다. */
    #phd-share-layer.is-debug .phd-btn { outline: 1px solid rgba(255, 80, 80, 0.9); }

    /* 토스트는 버튼 줄 바로 위에 띄운다. 캔버스 위라 그림자로 대비를 준다. */
    #phd-toast {
      font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      position: absolute;
      left: 0;
      right: 0;
      bottom: 100%;
      margin-bottom: 6px;
      text-align: center;
      font-size: 12px;
      color: #7C8CFF;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.85);
      opacity: 0;
      transition: opacity 0.16s ease-out;
      pointer-events: none;
    }
    #phd-toast.is-on { opacity: 1; }
    #phd-toast.is-error { color: #FF8FA3; }

  </style>

  <script>
    window.PHDShare = (function () {
      "use strict";

      // ---- 카카오톡 공유 설정 -------------------------------------------------
      // 켜려면 https://developers.kakao.com 에서
      //   1) 앱 생성 후 [앱 키 > JavaScript 키] 를 아래에 넣고
      //   2) [앱 설정 > 플랫폼 > Web] 에 이 페이지가 서빙되는 origin 을 등록한다.
      //      배포: https://dotoridoguldan.github.io  (경로는 뺀다. 하위 경로는 자동으로 커버된다)
      //      로컬 확인이 필요하면 http://localhost:<포트> 도 함께 등록한다.
      // 비워두면 카카오 버튼은 숨겨지고 시스템 공유 시트만 쓴다.
      var KAKAO_JS_KEY = "a85ba2768dfcf7e1636058cdc9c8c683";
      var KAKAO_SDK_URL = "https://t1.kakaocdn.net/kakao_js_sdk/2.7.4/kakao.min.js";

      var GAME_TITLE = ("⭐PLAY it YOUR WAY⭐").trim();
      // 공유 링크에는 쿼리/해시를 빼고 페이지 주소만 담는다.
      var SHARE_URL = location.origin + location.pathname;

      var layer = document.getElementById("phd-share-layer");
      var elToast = document.getElementById("phd-toast");
      var btnKakao = document.getElementById("phd-kakao");
      var btnShare = document.getElementById("phd-share");

      var canvas = null;
      var last = null;      // 마지막 결과 데이터
      var spot = null;      // Unity 가 알려준 자리(화면 대비 0~1 비율)
      var toastTimer = 0;
      var kakaoReady = false;

      // ---- 공유 문구 ---------------------------------------------------------

      function fmt(n) {
        return (n || 0).toLocaleString("ko-KR");
      }

      // 클리어한 라운드만큼 채운 블록 + 틀린 라운드 한 칸.
      // 워들처럼 결과가 한 줄로 보여서, 대화창에 붙였을 때 눈에 띈다.
      function pattern(cleared) {
        if (cleared > 12) return "🟪x" + cleared + "🟥";
        return new Array(cleared + 1).join("🟪") + "🟥";
      }

      function buildText(d, withUrl) {
        d = d || {};
        var cleared = Math.max(0, (d.round || 1) - 1);
        var lines = [
          GAME_TITLE + " · ROUND " + (d.round || 1),
          pattern(cleared),
          "SCORE " + fmt(d.score) + (d.newBest ? " · 신기록! 🏆" : " · BEST " + fmt(d.best))
        ];
        if (withUrl !== false) lines.push("▶ " + SHARE_URL);
        return lines.join("\n");
      }

      // ---- 자리 맞추기 -------------------------------------------------------

      // Unity 는 자기 화면(Screen.width/height) 대비 비율로 알려준다. 캔버스의 CSS 크기는
      // 그와 다를 수 있으므로 실제 픽셀 환산은 여기서 캔버스 크기를 보고 한다.
      function apply() {
        if (!spot || layer.hidden) return;

        if (!canvas) canvas = document.querySelector("#unity-canvas");
        if (!canvas) return;

        var c = canvas.getBoundingClientRect();
        if (!c.width || !c.height) return;

        layer.style.left = (c.left + c.width * spot.x) + "px";
        layer.style.top = (c.top + c.height * spot.y) + "px";
        layer.style.width = (c.width * spot.w) + "px";
        layer.style.height = (c.height * spot.h) + "px";
      }

      function place(x, y, w, h) {
        spot = { x: x, y: y, w: w, h: h };
        apply();
      }

      // 창 크기·회전이 바뀌면 비율은 그대로여도 캔버스의 CSS 박스가 달라진다.
      // Unity 는 비율이 안 바뀌면 다시 알려주지 않으므로 여기서 직접 다시 맞춘다.
      window.addEventListener("resize", apply);
      window.addEventListener("orientationchange", apply);
      window.addEventListener("scroll", apply, true);

      // ---- 잔손질 -----------------------------------------------------------

      function toast(message, isError) {
        elToast.textContent = message;
        elToast.classList.toggle("is-error", !!isError);
        elToast.classList.add("is-on");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () {
          elToast.classList.remove("is-on");
        }, 1600);
      }

      // 결과창을 열 때 미리 불러둔다. 버튼을 누른 뒤에 로드하면 사용자 제스처와
      // 시간이 벌어져 카카오 공유창이 팝업 차단에 걸릴 수 있다.
      function loadKakao() {
        if (!KAKAO_JS_KEY || kakaoReady || window.__phdKakaoLoading) return;
        window.__phdKakaoLoading = true;

        var script = document.createElement("script");
        script.async = true;
        script.src = KAKAO_SDK_URL;
        script.onload = function () {
          try {
            if (window.Kakao) {
              if (!window.Kakao.isInitialized()) window.Kakao.init(KAKAO_JS_KEY);
              kakaoReady = true;
            }
          } catch (e) {
            console.warn("[PHD] 카카오 초기화 실패:", e);
          }
        };
        script.onerror = function () {
          console.warn("[PHD] 카카오 SDK 를 불러오지 못했습니다.");
        };
        document.head.appendChild(script);
      }

      // ---- 공유 동작 ---------------------------------------------------------

      function shareKakao() {
        // SDK 2.x 는 Kakao.Share, 그 이전 버전은 Kakao.Link 였다.
        var api = window.Kakao && (window.Kakao.Share || window.Kakao.Link);
        if (!kakaoReady || !api) {
          toast("카카오톡 공유를 쓸 수 없어요", true);
          return;
        }
        var link = { mobileWebUrl: SHARE_URL, webUrl: SHARE_URL };
        try {
          api.sendDefault({
            objectType: "text",
            text: buildText(last, false) + "\n너도 도전해볼래?",
            link: link
          });
        } catch (e) {
          console.warn("[PHD] 카카오 공유 실패:", e);
          toast("공유에 실패했어요", true);
        }
      }

      function shareSystem() {
        if (!navigator.share) {
          toast("이 브라우저에서는 공유하기를 쓸 수 없어요", true);
          return;
        }
        navigator.share({
          title: GAME_TITLE,
          text: buildText(last, false),
          url: SHARE_URL
        }).catch(function (e) {
          // 공유 시트를 그냥 닫은 경우(AbortError)는 실패가 아니다.
          if (e && e.name !== "AbortError") toast("공유에 실패했어요", true);
        });
      }

      btnKakao.addEventListener("click", shareKakao);
      btnShare.addEventListener("click", shareSystem);

      // ---- Unity 가 부르는 창구 ----------------------------------------------

      function show(data) {
        last = data || {};
        layer.hidden = false;

        // 버튼 그림은 Unity 가 그리므로 여기서 감추지 않는다. 감추면 눌리지 않는 유령 버튼이 된다.
        // 쓸 수 없는 수단은 눌렀을 때 토스트로 알려주는 쪽을 택했다.
        loadKakao();

        apply();
      }

      function hide() {
        layer.hidden = true;
        clearTimeout(toastTimer);
        elToast.classList.remove("is-on");
      }

      // 히트 영역이 Unity 버튼과 맞는지 눈으로 확인할 때 쓴다.
      function debug(on) {
        layer.classList.toggle("is-debug", on !== false);
      }

      return { show: show, hide: hide, place: place, debug: debug, buildText: buildText };
    })();
  </script>

  <script src="Build/{{{ LOADER_FILENAME }}}"></script>
  <script>
    (function () {
      var canvas = document.querySelector("#unity-canvas");
      var loading = document.querySelector("#unity-loading");
      var fill = document.querySelector("#unity-progress-fill");
      var errorBox = document.querySelector("#unity-error");

      // 캔버스 위 우클릭 메뉴 / 제스처 확대 차단
      canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });
      document.addEventListener("gesturestart", function (e) { e.preventDefault(); });

      // ---- 렌더 버퍼 크기 계산 ----
      // 픽셀 퍼펙트 카메라는 정수 배율만 쓰기 때문에, 캔버스를 화면 크기 그대로 두면
      // 데스크톱(세로 픽셀이 부족한 화면)에서 배율이 1 로 떨어져 게임이 작게 렌더된다.
      // 그래서 버퍼를 "기준 해상도 x 고정 배율"로 잡고, 최종 확대는 브라우저(CSS)에 맡긴다.
      // 이렇게 하면 어떤 기기에서도 보이는 영역(=구도)이 동일하다.
      var BASE_W = 270;   // GameLayout.RefWidth
      var BASE_H = 480;   // GameLayout.RefHeight

      var container = document.querySelector("#unity-container");

      function layoutCanvas() {
        var vw = window.innerWidth || document.documentElement.clientWidth;
        var vh = window.innerHeight || document.documentElement.clientHeight;
        // 숨겨진 탭/iframe 에서 로드되면 크기가 0 으로 들어온다. 이때 계산하면
        // 캔버스가 0 높이로 굳어버리므로 건너뛰고, 보이게 됐을 때 다시 계산한다.
        if (!vw || !vh) return;

        var dpr = Math.min(window.devicePixelRatio || 1, 2);

        // 화면이 감당할 수 있는 배율(2~4). 배율은 선명도만 바꾸고 구도는 바꾸지 않는다.
        var scale = Math.floor(Math.min(vw * dpr / BASE_W, vh * dpr / BASE_H));
        scale = Math.max(2, Math.min(4, scale));

        // 세로는 화면비에 따라 늘어난다(긴 폰일수록 위아래가 더 보인다)
        var bufW = BASE_W * scale;
        var bufH = Math.max(BASE_H * scale, Math.round(bufW * vh / vw));

        canvas.width = bufW;
        canvas.height = bufH;

        // 버퍼 비율을 유지한 채 화면에 맞춰 확대/축소(남는 부분은 배경색)
        var fit = Math.min(vw / bufW, vh / bufH);
        container.style.width = Math.round(bufW * fit) + "px";
        container.style.height = Math.round(bufH * fit) + "px";
      }

      layoutCanvas();
      window.addEventListener("resize", layoutCanvas);
      window.addEventListener("orientationchange", layoutCanvas);
      // 숨겨진 상태로 로드된 뒤 화면에 나타나는 경우를 위해
      document.addEventListener("visibilitychange", layoutCanvas);
      if (window.ResizeObserver) new ResizeObserver(layoutCanvas).observe(document.documentElement);

      var config = {
        dataUrl: "Build/{{{ DATA_FILENAME }}}",
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
        codeUrl: "Build/{{{ CODE_FILENAME }}}",
#if MEMORY_FILENAME
        memoryUrl: "Build/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        // 렌더 버퍼는 layoutCanvas 가 직접 관리하므로 Unity 가 덮어쓰지 않게 한다.
        matchWebGLToCanvasSize: false,
        devicePixelRatio: 1
      };

      createUnityInstance(canvas, config, function (progress) {
        fill.style.width = (progress * 100) + "%";
      }).then(function () {
        loading.style.display = "none";
        // 로더가 캔버스 크기를 건드렸을 수 있으므로 마지막에 한 번 더 맞춘다.
        layoutCanvas();
        canvas.focus();
      }).catch(function (message) {
        loading.style.display = "none";
        errorBox.style.display = "block";
        errorBox.textContent = message;
      });
    })();
  </script>
</body>
</html>
